[project]
name = "KVP10k"
version = "0.1"
description = "KVP10k dataset with training and benchmarking"
license = { text = "" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdf2image~=1.17.0",
    "requests~=2.32.5",
    "tesserocr",
    "datasets==5.0.1",
    "numpy~=1.26.4",
    "Pillow~=10.2.0",
    "pandas~=2.2.1",
    "matplotlib==3.8.3",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "transformers==5.10.0",
    "tokenizers==0.22.2",
    "lightning==2.6.6",
    "pytorch-lightning==2.6.6",
    "bitsandbytes==0.50.2",
    "flash-attn==2.8.3.post1",
    "peft==0.20.0",
    "accelerate==1.15.0",
    "textdistance==4.6.1",
    "opencv-python==4.8.1.78",
    "scikit-learn==1.3.0",
]

[build-system]
requires = ["setuptools>=68.2.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["utils*"]
